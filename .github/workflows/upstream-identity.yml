# Tie KNOWN_MCP_PREFIXES to what the producer actually publishes.
#
# mcp-tool-prefixes.test.ts is a good gate: it scans every tracked file and
# fails on a prefix outside its allowlist. Its weakness is that the allowlist
# is hand-copied. In 2026-08 the codebase-intelligence plugin renamed itself
# and the row still read `mcp__plugin_automatised-pipeline_…`, so the gate
# certified the dead spelling in SKILL.md and EXAMPLES.md as correct — the
# same shape as the Cortex v4.15.0 incident its own header recounts.
#
# The producer publishes mcp-contract.json as the machine source of truth.
# This job checks the allowlist against it, pinned to a commit SHA rather than
# a tag because the producer's README is explicit that tags can be moved.
name: Upstream identity

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  contract:
    name: allowlist agrees with the upstream contract
    runs-on: ubuntu-latest
    env:
      CONTRACT_URL: https://raw.githubusercontent.com/cdeust/ai-architect-mcp-codebase/37728cc5747cebe39ea9d4011b7424de90f0a57b/mcp-contract.json
      GATE: packages/validation/src/__tests__/mcp-tool-prefixes.test.ts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch the pinned contract
        run: |
          set -euo pipefail
          # Outside the tree: the contract lists the revoked prefixes, so a
          # repo scan must not find them in a file this job just wrote.
          curl --fail --location --silent --show-error \
               --connect-timeout 5 --max-time 30 --retry 2 \
               "$CONTRACT_URL" -o "$RUNNER_TEMP/contract.json"
          jq -e '.schema_version == 1' "$RUNNER_TEMP/contract.json" >/dev/null

      - name: The allowlist must carry the canonical prefix, derived not restated
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/contract.json"
          plugin=$(jq -r '.claude_plugin' "$contract")
          server=$(jq -r '.mcp_server' "$contract")
          derived="mcp__plugin_${plugin}_${server}__"
          if [ "$derived" != "$(jq -r '.claude_tool_prefix' "$contract")" ]; then
            echo "::error::contract is internally inconsistent"; exit 1
          fi
          grep -q -e "$derived" "$GATE" || {
            echo "::error::$GATE does not allow $derived"
            echo "        the gate would reject every correct call to the upstream server"
            exit 1
          }
          echo "allowlist carries $derived"

      - name: No revoked prefix outside an explicitly marked line
        run: |
          set -euo pipefail
          status=0
          while read -r revoked; do
            # -e carries the pattern: `--` would end option parsing and turn
            # the --exclude-dir flags into path operands.
            # mcp-prefix-allow-legacy is the marker the gate itself defines.
            hits=$(grep -rn --binary-files=without-match \
                     --exclude-dir=.git --exclude-dir=.github \
                     --exclude-dir=node_modules --exclude-dir=dist \
                     -e "$revoked" . \
                   | grep -v 'mcp-prefix-allow-legacy' || true)
            if [ -n "$hits" ]; then
              echo "::error::revoked upstream prefix present: $revoked"
              printf '%s\n' "$hits"
              status=1
            fi
          done < <(jq -r '.revoked_claude_tool_prefixes[]' "$RUNNER_TEMP/contract.json")
          exit $status
