name: CI

# Runs on every push to main and every pull request. Failure on any step
# blocks merge.
#
# Stages:
#   1. checkout + setup node + pnpm cache
#   2. install (frozen lockfile — fails if pnpm-lock.yaml is stale)
#   3. build (sequential workspace build to respect topological order;
#      `pnpm -r build` non-sequential races package outputs)
#   4. test (vitest workspace, runs all package suites including smoke)
#
# What this protects against (per phase-2 audit consensus):
#   - protocol regressions in the runner / handlers
#   - dispatcher contract drift between SKILL.md and code
#   - smoke tests breaking under transitive dependency updates
#   - workspace topology breakage (a package moves and others can no longer build)
#
# What this does NOT protect against:
#   - real ecosystem integration (no live ai-architect-mcp-codebase / Cortex MCPs)
#   - LLM judge response drift
#   - performance regressions (no time budget asserted in tests)
# Both gaps are tracked in the project roadmap.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN across every job in this file (issue #36,
# Scorecard TokenPermissionsID). Nothing here writes to the repository: the
# jobs build, test, and read the dependency graph. A job that ever needs more
# raises it in its own `permissions:` block rather than widening this one.
#
# This block is also what drives the check's SCORE. Per Scorecard's
# checks/evaluation/permissions.go, a job-level write costs points only when
# its own file declares no top-level permissions (`undeclaredPermissions
# ["topLevel"]` → score -= 0.5) or the file also holds a top-level write
# (→ score 0). release.yml already declares `contents: read` at top level, so
# its job-level `contents: write` — which creating a GitHub Release genuinely
# requires — is logged as a warning detail and costs nothing. This file having
# NO top-level block was the finding that zeroed the check.
permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # source: package.json declares pnpm v10 in pnpm-lock.yaml metadata.
          version: 10

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if pnpm-lock.yaml is stale; this keeps
        # CI's install identical to local development.
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high severity, prod tree)
        # Issue #29 criterion 5. npm is where the ecosystem's supply-chain
        # attacks land (postinstall in a transitive dep), and a pnpm workspace
        # with a lockfile is exactly the targeted shape. Scoped to --prod: a
        # dev-only advisory does not ship in the .mcpb, and gating the whole
        # matrix on it would make the audit a gate everyone learns to skip
        # (the ai-architect-mcp-codebase #77 lesson). High+ in the production tree
        # is blocking; run once (Node 20 leg) since the advisory set is
        # node-version-independent.
        if: matrix.node-version == '20.x'
        run: pnpm audit --prod --audit-level high

      - name: Build (sequential)
        # source: a non-sequential build raced package outputs and broke
        # transitively on cold caches. The orchestration package depends on
        # core's dist/ via @prd-gen/core; if core finishes after orchestration
        # starts, the latter cannot resolve types. Sequential is mandatory.
        run: pnpm build

      - name: Lint (per-package typecheck)
        # Enforces the root lint script in CI so it cannot silently rot
        # again (it was structurally broken for months, invisible because
        # CI never ran it — see PR #21).
        run: pnpm run lint

      - name: Bundle (mcp-server self-contained ESM)
        # Produces mcp-server/index.js — the standalone bundle the
        # marketplace install runs via .mcp.json. Must be reproducible
        # from source on every CI run.
        run: pnpm bundle

      - name: Bundle freshness check
        # The committed mcp-server/ MUST match what the current source
        # produces. Drift means a contributor forgot to re-bundle before
        # committing. Fail CI rather than silently shipping a stale bundle to
        # the marketplace.
        # source: cross-audit follow-through — Phase 4 strategy-wiring
        # round, public-readiness baseline (2026-04).
        #
        # The whole directory, not just index.js: `pnpm bundle` also stamps
        # mcp-server/package.json with the release version, and that file is
        # what the server reads to answer `initialize`. Diffing only index.js
        # would let the advertised version drift again — which is exactly how
        # it reached 0.4.0 against a 0.6.1 release.
        run: |
          if ! git diff --exit-code -- mcp-server/; then
            echo "::error::mcp-server/ is out of date. Run 'pnpm bundle' locally and commit the result."
            exit 1
          fi

      - name: Test
        # Vitest workspace runs every package's vitest.config.ts, including the
        # scripts/release project that regression-tests the #23 .mcpb-checksum
        # class (issue #29 criterion 4).
        #
        # --coverage because the 80% statement floor is a GATE: vitest exits
        # non-zero below it (verified — raising the threshold to 95 produces
        # "ERROR: Coverage for statements (81.17%) does not meet global
        # threshold (95%)" and exit 1). Run on the Node 20 leg only; coverage
        # is a property of the code, not of the runtime, and instrumenting both
        # legs doubles the cost for an identical number.
        run: ${{ matrix.node-version == '20.x' && 'pnpm test:coverage' || 'pnpm test' }}

      - name: Test (growth / anti-ReDoS, run alone)
        # Timing-sensitive assertions, deliberately outside the parallel suite:
        # a growth ratio measured while ~97 files compete for the CPU measures
        # the scheduler. Run once, on the Node 20 leg, with fileParallelism off.
        if: matrix.node-version == '20.x'
        run: pnpm test:perf

      - name: Test (external-judge harness)
        # scripts/external-judge runs on node:test, not vitest, so `pnpm test`
        # never touched it — the script existed in package.json and no
        # workflow called it, which is the same "structurally broken, invisible
        # because CI never ran it" shape as the lint script in PR #21.
        #
        # It earns its place on the matrix rather than a single leg: the
        # harness binds its corpus with `import … with { type: "json" }`, whose
        # support is node-version-dependent (>=20.10), so running it on both
        # 20.x and 22.x is precisely the gate. No network — every test is
        # offline (the no-credentials path returns "skipped").
        run: pnpm run test:external-judge

      - name: Test portable Codex and Gemini packaging
        run: pnpm run test:portable

      - name: Verify product and distribution identities
        run: pnpm run check:identity

      - name: Documented claims match the suite
        # The advertised test count is quoted in eight user-facing places. The
        # gate that checks it ran at release time only, so main could carry a
        # stale claim for as long as no release happened — and did: a693e15
        # moved the 5 growth tests into the perf project, the default suite went
        # 1496 -> 1491, and every badge and description kept claiming 1496 until
        # 2026-07-27. Release time is too late for a number a reader sees on the
        # README; check it where the drift is introduced.
        #
        # Node 20 leg only: the count is a property of the suite, not of the
        # runtime, and the script runs `vitest run` itself.
        if: matrix.node-version == '20.x'
        run: pnpm check:docs

  mcpb-smoke:
    name: mcpb smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The distributable, actually started. `build + test` exercises the
    # workspace SOURCES; it says nothing about the artifact users install. That
    # gap shipped a .mcpb whose own declared command — `node
    # ${__dirname}/mcp-server/index.js` per manifest.json — exited on
    # `Cannot find module 'ajv'`, because the staged tree carried no
    # node_modules and nothing in the bundle invoked bin/ensure-deps.sh.
    # This job stages the bundle exactly as release.yml does (same script) and
    # speaks MCP to it over stdio.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # source: package.json declares pnpm v10 in pnpm-lock.yaml metadata.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor the package declares, so the artifact is proven on the
          # oldest runtime it claims to support.
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        run: pnpm build && pnpm bundle

      - name: Stage and start the .mcpb
        # Asserts initialize returns serverInfo AND tools/list returns the
        # expected count. "the file exists" would have passed while the server
        # was unstartable.
        run: bash scripts/release/smoke-mcpb.sh

      - name: Start the shipped Codex and Gemini verifier commands
        # Reads command + args from each host manifest, launches the real
        # ensure-deps.sh path, completes initialize/tools-list, then calls the
        # deterministic verifier. This guards the portable path separately
        # from the Claude-oriented .mcpb smoke above.
        run: pnpm run test:portable:runtime

      - name: Run pinned OpenAI Codex validators
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          bash scripts/run-codex-validators.sh \
            . skills/audit-prd skills/validate-spec
        env:
          GH_TOKEN: ${{ github.token }}

  dependency-review:
    name: dependency review (PR)
    runs-on: ubuntu-latest
    # Issue #29 criterion 5. Only meaningful on a pull_request (it diffs the
    # PR's dependency change against the base); on push there is no base to
    # compare, so the job is scoped to PRs.
    #
    # ADVISORY, not blocking: dependency-review-action requires GitHub's
    # Dependency Graph, which is not enabled on this repository (the action
    # errors "Dependency review is not supported on this repository"). Rather
    # than a permanently-red required check for a repo-settings reason a
    # contributor cannot fix in a diff, the step is continue-on-error and the
    # HARD gate is `pnpm audit --prod --audit-level high` above (criterion 5's
    # "or equivalent"). Enable Dependency Graph in repo settings and drop
    # continue-on-error to make this enforcing.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        continue-on-error: true
        with:
          fail-on-severity: high
