name: Release

# Supply-chain hardening (issue #29). This repo's distributed artifact is the
# `.mcpb` bundle attached to the GitHub Release and referenced by server.json
# in the MCP registry; the marketplace consumes the git tree. All workspace
# packages are `private: true` and NOTHING is published to npm, so npm
# provenance (issue #29 criterion 2) has no artifact to attest — see the
# per-job notes. What this workflow now does:
#   * attests build provenance for the .mcpb and the SBOM (Sigstore; verify
#     with `gh attestation verify <file> --repo cdeust/ai-architect-mcp-spec`);
#   * generates a CycloneDX SBOM from pnpm-lock.yaml covering the workspace;
#   * VERIFIES server.json's fileSha256 equals the built .mcpb before it is
#     committed/published — closing the #23 defect class in the pipeline, not
#     just its instance (scripts/release/verify-mcpb-checksum.mjs);
#   * pins every third-party action to a commit SHA.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build, test, and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release, upload assets, push checksum branch
      pull-requests: write  # open the protected-main checksum update PR
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify product and distribution identities
        run: pnpm check:identity

      - name: Build all packages
        run: pnpm build

      - name: Run full test suite
        run: pnpm test

      - name: Rebuild and bundle MCP server
        run: pnpm bundle

      - name: Verify mcp-server bundle is current
        run: |
          # Rebuild the bundle and fail if the committed version diverges
          # from the rebuilt one (catches "I forgot to commit dist/" PRs).
          if [ -d packages/mcp-server/dist ]; then
            git diff --exit-code packages/mcp-server/dist/ \
              || (echo "::error::mcp-server bundle out of date — run 'pnpm build' and commit"; exit 1)
          fi

      - name: Verify the numbers the docs advertise are still true
        run: |
          set -euo pipefail
          # The test count is quoted in six user-facing places, including the
          # marketplace descriptions a prospective user reads. It went stale
          # twice in one working session (877 while the suite was 962, then 962
          # while it was 1496), so it is checked where it matters: at publish.
          pnpm check:docs

      - name: Assemble .mcpb staging directory
        run: |
          set -euo pipefail
          # Shared with the `mcpb smoke` job in ci.yml, deliberately. This step
          # used to inline the staging, so the tree that ships was assembled
          # only during a tag release and never started — which is how a .mcpb
          # whose declared command dies on `Cannot find module 'ajv'` reached
          # users past a green suite.
          STAGE_DIR="$(mktemp -d)/ai-architect-mcp-spec-mcpb"
          bash scripts/release/stage-mcpb.sh "${STAGE_DIR}"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"

      - name: Smoke-test the staged bundle before packing it
        run: |
          set -euo pipefail
          # Speaks MCP to the staged tree using the command manifest.json
          # declares. A release stops here rather than shipping a server that
          # cannot start.
          bash scripts/release/smoke-mcpb.sh

      - name: Pack .mcpb bundle
        run: |
          set -euo pipefail
          OUTFILE="${GITHUB_WORKSPACE}/ai-architect-mcp-spec.mcpb"

          # Use @anthropic-ai/mcpb if available, else zip
          if npx -y --yes @anthropic-ai/mcpb@latest pack --help >/dev/null 2>&1; then
            npx -y @anthropic-ai/mcpb@latest pack "${STAGE_DIR}" "${OUTFILE}"
          else
            (cd "${STAGE_DIR}" && zip -r "${OUTFILE}" .)
          fi

          # Compute SHA-256 checksum
          shasum -a 256 "${OUTFILE}" | awk '{print $1}' > "${OUTFILE}.sha256"
          echo "SHA256: $(cat "${OUTFILE}.sha256")"
          echo "MCPB_SHA256=$(cat "${OUTFILE}.sha256")" >> "$GITHUB_ENV"

      - name: Generate CycloneDX SBOM from pnpm-lock.yaml
        run: |
          set -euo pipefail
          # cdxgen reads pnpm-lock.yaml directly and walks the workspace, so
          # "what is actually in this bundle" — a genuinely hard question for a
          # bundled npm artifact (issue #29) — is answerable. Pinned by version;
          # this is an npm package, not a GitHub Action, so the SHA-pin rule
          # (criterion 8) does not apply, but the version is fixed so the run is
          # reproducible. FETCH_LICENSE stays off to keep the job network-light.
          npx -y @cyclonedx/cdxgen@12.8.2 -t pnpm --spec-version 1.5 \
            -o ai-architect-mcp-spec.cdx.json
          node -e "JSON.parse(require('fs').readFileSync('ai-architect-mcp-spec.cdx.json','utf8'))"
          echo "SBOM components: $(node -e "console.log((JSON.parse(require('fs').readFileSync('ai-architect-mcp-spec.cdx.json','utf8')).components||[]).length)")"
          shasum -a 256 ai-architect-mcp-spec.cdx.json | awk '{print $1}' > ai-architect-mcp-spec.cdx.json.sha256

      - name: Attest build provenance (.mcpb + SBOM)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ai-architect-mcp-spec.mcpb
            ai-architect-mcp-spec.cdx.json

      - name: Patch server.json with the real .mcpb checksum
        run: |
          set -euo pipefail
          # INVARIANT (see scripts/publish-mcp-registry.sh header): the
          # fileSha256 is intentionally absent before release because the real
          # checksum only exists after this job builds the .mcpb above. Add it
          # here and commit the single-file change on a dedicated branch in the
          # next step; this closes the loop for the current tag automatically
          # without bypassing protected main (#23), and leaves
          # publish-mcp-registry.sh as a manual fallback for any tag whose
          # release job didn't run this step (e.g. pre-#23 releases).
          jq --arg sha "${MCPB_SHA256}" '.packages[0].fileSha256 = $sha' server.json > server.json.tmp
          mv server.json.tmp server.json
          jq empty server.json
          echo "Patched fileSha256: $(jq -r '.packages[0].fileSha256' server.json)"

      # Close the #23 defect class in the pipeline (issue #29 criterion 4): the
      # value we are about to publish MUST equal the artifact we built. This
      # recomputes the .mcpb digest and rejects any mismatch (exit 1) before
      # server.json is committed or the registry sees it. The same assertion is
      # unit-tested in scripts/release/verify-mcpb-checksum.test.mjs.
      - name: Verify server.json checksum matches the built .mcpb
        run: |
          node scripts/release/verify-mcpb-checksum.mjs \
            ai-architect-mcp-spec.mcpb server.json

      - name: Open protected-main PR for patched server.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- server.json; then
            echo "server.json already carries the correct checksum; nothing to commit."
            exit 0
          fi
          CHECKSUM_BRANCH="release/${GITHUB_REF_NAME}-server-json"
          if git ls-remote --exit-code --heads origin "${CHECKSUM_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Checksum branch ${CHECKSUM_BRANCH} already exists; inspect its PR before rerunning."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "${CHECKSUM_BRANCH}"
          git add server.json
          git commit -m "chore(release): patch server.json sha256 for ${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${CHECKSUM_BRANCH}"
          gh pr create \
            --base main \
            --head "${CHECKSUM_BRANCH}" \
            --title "chore(release): patch server.json sha256 for ${GITHUB_REF_NAME}" \
            --body "Automated checksum update for the verified canonical MCPB built by release run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Merge this PR before publishing ${GITHUB_REF_NAME} to the MCP Registry. SHA-256: \`${MCPB_SHA256}\`."

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section between [VERSION] and the next [section] heading
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" ver "]")) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION; using tag message" > release-notes.md
          fi
          # Append SHA256 to release notes for auditability
          echo "" >> release-notes.md
          echo "### Canonical .mcpb bundle" >> release-notes.md
          echo "Artifact: \`ai-architect-mcp-spec.mcpb\`" >> release-notes.md
          echo "SHA-256: \`${MCPB_SHA256}\`" >> release-notes.md

      - name: Create GitHub Release (with .mcpb artifact + SBOM)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ai-architect-mcp-spec.mcpb
            ai-architect-mcp-spec.mcpb.sha256
            ai-architect-mcp-spec.cdx.json
            ai-architect-mcp-spec.cdx.json.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
